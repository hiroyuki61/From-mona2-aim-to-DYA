on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install West
        run: pip3 install west
      - name: West Init
        run: west init -l config
      - name: West Update
        run: west update
      - name: West Zephyr export
        run: west zephyr-export
      - name: West Build (Left)
        # 修正ポイント：-DZMK_EXTRA_MODULES 以下の記述を追加
        run: west build -s zmk/app -b seeeduino_xiao_ble -- -DSHIELD=mona2_l -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}"
      - name: mona2_l Kconfig file copy
        run: cp build/zephyr/.config mona2_l.config
      - name: West Build (Right)
        # 修正ポイント：ここにも追加。さらに -p (pristine) を入れてクリーンビルドを確実に
        run: west build -p -s zmk/app -b seeeduino_xiao_ble -- -DSHIELD=mona2_r -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}"
      - name: mona2_r Kconfig file copy
        run: cp build/zephyr/.config mona2_r.config
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mona2_firmware
          path: |
            build/zephyr/zmk.uf2
            mona2_l.config
            mona2_r.config